body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:22px 16px 26px;border-radius:0 0 26px 26px}
.hero h1{margin:0;font-size:21px}.hero p{margin:2px 0 16px;font-size:13px;opacity:.8}
.box{position:relative;margin-bottom:12px}.box i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);font-style:normal;opacity:.6}
#q{width:100%;font:inherit;font-size:17px;padding:14px;padding-inline-start:44px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);outline:none;text-align:left;box-shadow:0 2px 8px rgba(16,36,62,.08)}
main{padding:14px;max-width:900px;margin:auto}
.sug{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:12px}
.sug button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);font:inherit;font-weight:600;padding:13px 16px;direction:ltr}
.sug button:last-child{border:0}.sug button span{color:var(--ac)}
.crumb{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:15px}
.crumb b{background:var(--acbg);color:var(--ac);padding:4px 14px;border-radius:99px;direction:ltr}
.lbl{color:var(--mut);font-size:14px;margin:10px 0 8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1.5px solid var(--bd);color:var(--tx);border-radius:14px;padding:12px;font:inherit;font-weight:600;text-align:start;direction:ltr}
.type .ic{font-size:22px}.type small{font-weight:500;color:var(--mut);direction:rtl}
.type.none{opacity:.5}.type.on{border-color:var(--ac);background:var(--acbg)}.type.on small{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--ac);border-radius:14px;padding:4px 14px;margin:10px 0;box-shadow:0 1px 4px rgba(16,36,62,.06)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}
.k{color:var(--mut);font-size:14px;flex:none;max-width:46%}.v{font-weight:600;text-align:left;direction:ltr;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.empty.big{font-size:20px;font-weight:700}
.hero{padding-bottom:18px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.16);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;color:#fff;font:inherit;font-weight:600;padding:9px;border-radius:11px}
.tabs button.on{background:#fff;color:var(--h1)}
[hidden]{display:none!important}
#mini{display:none;border-radius:0;background:linear-gradient(135deg,var(--h1),var(--h2));padding:6px 8px;height:48px}
body.ss #mini{display:flex}body.ss .hero{display:none}body.ss{overflow:hidden}
body.ss main{padding:0;max-width:none}
#v2 iframe{display:block;width:100%;border:0;height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
</style>
</head>
