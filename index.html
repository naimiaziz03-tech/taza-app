<style>

main{padding:14px;max-width:900px;margin:auto}
.sug{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:12px}
.sug button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);font:inherit;font-weight:600;padding:13px 16px;direction:ltr}
.sug button:last-child{border:0}.sug button span{color:var(--ac)}

.lbl{color:var(--mut);font-size:14px;margin:10px 0 8px}

.hero{position:relative}
#menuBtn{position:absolute;left:12px;top:12px;width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:1}

const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rank=t=>{const n=norm(t);return n.startsWith("transformateur")?0:n.startsWith("disjoncteur")?1:9};
const icon=t=>{const n=norm(t);return n.startsWith("transformateur")?"⚡":n.startsWith("disjoncteur")?"🔌":n.startsWith("sectionneur")?"🔧":n.startsWith("re")?"📏":"🧱"};
const $=id=>document.getElementById(id),q=$("q"),sug=$("sug"),types=$("types"),out=$("out");
const allTypes=[...new Set(DATA.map(r=>r.t))].sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
const postes=[...new Set(DATA.map(r=>r.p))].sort();
let cur=null;
function suggest(){
  cur=null;types.innerHTML="";const n=norm(q.value);
  const m=n?postes.filter(p=>norm(p).startsWith(n)):[];
  sug.innerHTML=m.length?`<div class="sug">`+m.map(p=>`<button data-p="${esc(p)}">${esc(p)}<span>‹</span></button>`).join("")+`</div>`:"";
  out.innerHTML=!q.value.trim()?'<div class="empty">ابدأ بكتابة الحروف الأولى من اسم المحطة</div>':(m.length?"":'<div class="empty big">لا يوجد</div>');
}
sug.onclick=e=>{const b=e.target.closest("button");if(b)pick(b.dataset.p)};
function pick(p){
  cur=p;q.value=p;sug.innerHTML="";out.innerHTML="";
  const c={};DATA.filter(r=>r.p===p).forEach(r=>c[r.t]=(c[r.t]||0)+1);
  types.innerHTML=`<div class="crumb">المحطة: <b>${esc(p)}</b></div><div class="lbl">اختر نوع المعدة (Type d'équipement)</div><div class="types">`+allTypes.map(t=>`<button class="type${c[t]?"":" none"}" data-t="${esc(t)}"><span class="ic">${icon(t)}</span>${esc(t)}<small>${c[t]?c[t]+" عنصر":"لا يوجد"}</small></button>`).join("")+`</div>`;
}
types.onclick=e=>{const b=e.target.closest(".type");if(b)show(b.dataset.t)};
function show(t){
  [...types.querySelectorAll(".type")].forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  const rs=DATA.filter(r=>r.p===cur&&r.t===t);
  out.innerHTML=!rs.length?'<div class="empty big">لا يوجد</div>':`<div class="lbl">${rs.length} نتيجة</div>`+rs.map(r=>`<div class="card">`+Object.entries(r.d).map(([k,v])=>`<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")+`</div>`).join("");
  out.scrollIntoView({behavior:"smooth",block:"start"});
}
q.addEventListener("input",suggest);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=sug.querySelector("button");if(b)pick(b.dataset.p)}});

})();

<script>

let S=[],db=null,edit=false;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("sections-app",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){
  let old=[];try{old=JSON.parse(localStorage.getItem("secs")||"[]")}catch(e){}
  try{
    db=await idb();
    const v=await new Promise(res=>{const q=db.transaction("kv").objectStore("kv").get("secs");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});
    S=(v&&v.length)?v:old;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){S=old}
  S.forEach(s=>{if(!s.branches){s.branches=(s.items&&s.items.length)?[{id:1,name:"عام",items:s.items,open:false}]:[];delete s.items}});
  render();if(S.length)save();
}
function save(){
  if(db){try{db.transaction("kv","readwrite").objectStore("kv").put(S,"secs");return}catch(e){}}
  try{localStorage.setItem("secs",JSON.stringify(S))}catch(e){alert("المساحة ممتلئة، احذف بعض الصور")}
}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function addSec(){const v=nt.value.trim();if(!v)return;S.unshift({id:Date.now(),title:v,heading:v,branches:[],open:true});nt.value="";save();render()}
function tog(i){S[i].open=!S[i].open;save();render()}
function delSec(i){if(confirm("حذف هذا القسم؟")){S.splice(i,1);save();render()}}
function setT(i,v){S[i].heading=v;S[i].title=v||S[i].title;save();document.querySelectorAll(".hd b")[i].textContent=S[i].title}
function addBr(i){const el=document.getElementById("nb"+i),v=el.value.trim();if(!v)return;S[i].branches.push({id:Date.now(),name:v,items:[],open:true});save();render()}
function togBr(i,k){S[i].branches[k].open=!S[i].branches[k].open;save();render()}
function setBN(i,k,v){S[i].branches[k].name=v;save()}
function delBr(i,k){if(confirm("حذف هذا الفرع؟")){S[i].branches.splice(k,1);save();render()}}
function setX(i,k,j,v){S[i].branches[k].items[j].text=v;save()}
function delIt(i,k,j){S[i].branches[k].items.splice(j,1);save();render()}
async function addImgs(i,k,inp){const fs=[...inp.files];for(const f of fs){try{S[i].branches[k].items.push({img:await shrink(f),text:""})}catch(e){}}inp.value="";save();render()}
function shrink(f){return new Promise(r=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.75))};im.src=URL.createObjectURL(f)})}
function render(){
  const eb=edit?'<div class="em">✏️ وضع التعديل مفعّل</div>':"";
  list.innerHTML=eb+(S.length?S.map((s,i)=>`<div class="sec ${s.open?"open":""}">
  <div class="hd" onclick="tog(${i})"><b>${esc(s.title)}</b><span class="ar">‹</span></div>
  <div class="body">
   ${edit?`<input class="bigt" value="${esc(s.heading)}" placeholder="العنوان الكبير" oninput="setT(${i},this.value)">`:`<div class="bigt">${esc(s.heading)}</div>`}
   ${s.branches.map((b,k)=>`<div class="br ${b.open?"open":""}"><div class="bh" onclick="togBr(${i},${k})">${edit?`<input value="${esc(b.name)}" onclick="event.stopPropagation()" oninput="setBN(${i},${k},this.value)"><button class="d" onclick="event.stopPropagation();delBr(${i},${k})">حذف</button>`:`<b>${esc(b.name)}</b>`}<span class="ar">‹</span></div>
    <div class="bb">${b.items.map((t,j)=>`<div class="it"><img src="${t.img}"><textarea placeholder="اكتب ما تشاء هنا..." oninput="setX(${i},${k},${j},this.value)">${esc(t.text)}</textarea>${edit?`<div class="srow"><span></span><button class="d" onclick="delIt(${i},${k},${j})">حذف الصورة</button></div>`:""}</div>`).join("")}
    <div class="srow"><label class="btn g" style="position:relative;overflow:hidden">+ إضافة صور<input type="file" accept="image/*" multiple style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0" onchange="addImgs(${i},${k},this)"></label></div></div></div>`).join("")||'<div class="empty">لا توجد فروع</div>'}
   ${edit?`<div class="add" style="margin-top:12px"><input id="nb${i}" placeholder="اسم فرع جديد..."><button onclick="addBr(${i})">+ فرع</button></div><div class="srow"><span></span><button class="d" onclick="delSec(${i})">حذف القسم</button></div>`:""}
  </div></div>`).join(""):'<div class="empty">لا توجد أقسام بعد. أضف عنواناً للبدء.</div>')
}
menuBtn.onclick=()=>{menu.hidden=!menu.hidden};
editBtn.onclick=()=>{edit=!edit;menu.hidden=true;editBtn.textContent=edit?"✔️ إنهاء التعديل":"✏️ تعديل";render()};
load();
const tabs=n=>{v1.hidden=n!==1;v2.hidden=n!==2;menuBtn.hidden=n!==2;if(n!==2)menu.hidden=true;t1.classList.toggle("on",n===1);t2.classList.toggle("on",n===2)};
t1.onclick=()=>tabs(1);t2.onclick=()=>tabs(2);
</script>
